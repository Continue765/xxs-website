name: Deploy public site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject private paths and drafts; check manifest and links
        run: |
          python scripts/check_git_privacy.py
          python scripts/check_site.py site --release
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
